<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Paste - URL Banao</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; padding: 20px;
}
.container {
  max-width: 760px; margin: 0 auto; background: #fff;
  border-radius: 16px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
}
h1 { color: #111; margin-bottom: 8px; font-size: 1.5rem; }
p.sub { color: #555; margin-bottom: 22px; font-size: .95rem; }
textarea {
  width: 100%; height: 260px; border: 2px solid #ddd; border-radius: 10px;
  padding: 12px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: .95rem; resize: vertical; outline: none; transition: border .2s;
}
textarea:focus { border-color: #764ba2; }
.row { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button.gen {
  background: #764ba2; color: #fff; border: none; border-radius: 10px;
  padding: 12px 22px; font-size: 1rem; font-weight: 700; cursor: pointer;
}
button.gen:hover { background: #5f3a8a; }
button.gen:active { transform: translateY(1px); }
button.gen:disabled { opacity: .6; cursor: not-allowed; }
.result { margin-top: 18px; padding: 14px; border-radius: 10px; background: #eef2ff;
  border: 1px dashed #764ba2; display: none; word-break: break-all; }
.result.show { display: block; }
.result a { color: #5b21b6; font-weight: 700; text-decoration: none; }
.result a:hover { text-decoration: underline; }
.copy {
  background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 6px 14px;
  font-size: .85rem; cursor: pointer; margin-left: 8px;
}
.copy:hover { background: #f7f7f7; }
.hint { margin-top: 14px; font-size: .85rem; color: #666; }
footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid #eee; color: #777; font-size: .8rem; }
</style>
</head>
<body>
<div class="container">
  <h1>HTML Paste</h1>
  <p class="sub">Niche apna HTML code paste karo, "Generate URL" dabao - ek share karne layak URL mil jayega.</p>

  <textarea id="html" placeholder="&lt;h1&gt;Namaste!&lt;/h1&gt;
&lt;p style=&quot;color:red&quot;&gt;Yeh mera HTML page hai.&lt;/p&gt;"></textarea>

  <div class="row">
    <button class="gen" id="btn" onclick="createPaste()">Generate URL</button>
  </div>

  <div class="result" id="result">
    <strong>Apna URL:</strong> <a id="url" href="#" target="_blank"></a>
    <button class="copy" id="copyBtn" onclick="copyUrl()">Copy</button>
  </div>

  <p class="hint" id="msg"></p>

  <footer>
    No Docker &bull; Runs on Node.js &bull; Deploy on Railway (free tier) or any VPS
  </footer>
</div>

<script>
async function createPaste() {
  const html = document.getElementById('html').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const result = document.getElementById('result');

  if (!html) {
    msg.textContent = 'Pehle HTML paste karo!';
    msg.style.color = '#c00';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Processing...';
  msg.textContent = '';

  try {
    const resp = await fetch('/api/paste', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html }),
    });
    const data = await resp.json();

    if (!resp.ok) throw new Error(data.error || 'Kuch galat hua');

    const link = document.getElementById('url');
    link.href = data.url;
    link.textContent = data.url;
    result.classList.add('show');
    msg.textContent = 'URL ready hai! Neeche copy karo.';
    msg.style.color = '#166534';
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#c00';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate URL';
  }
}

function copyUrl() {
  const url = document.getElementById('url').href;
  navigator.clipboard.writeText(url).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = 'Copied!';
    setTimeout(() => b.textContent = 'Copy', 1200);
  });
}
</script>
</body>
</html>
