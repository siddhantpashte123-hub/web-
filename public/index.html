<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Paste - URL Banao</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --accent: #ec4899;
  --bg: #0f172a;
  --card: rgba(30, 41, 59, 0.7);
  --text: #f8fafc;
  --muted: #94a3b8;
  --success: #22c55e;
  --border: rgba(255,255,255,0.1);
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background:
    radial-gradient(circle at 25% 25%, #1e293b 0%, transparent 50%),
    radial-gradient(circle at 75% 75%, #1e1b4b 0%, transparent 50%),
    #0f172a;
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* Background glow blobs */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: -1;
  opacity: 0.6;
  animation: float 10s infinite ease-in-out;
}
.blob-1 {
  top: -10%; left: -10%;
  width: 500px; height: 500px;
  background: var(--primary);
}
.blob-2 {
  bottom: -10%; right: -10%;
  width: 600px; height: 600px;
  background: var(--accent);
  animation-delay: -5s;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(30px, -50px); }
  66% { transform: translate(-20px, 30px); }
}

/* Reveal animation on load */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-in { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

.container {
  max-width: 720px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 10px;
  animation: fadeInUp 0.8s both;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

.logo svg { width: 32px; height: 32px; }

.tagline {
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.95rem;
}

.card {
  background: var(--card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 24px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
}

h1 {
  font-size: 1.75rem;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

p.sub {
  color: var(--muted);
  margin-bottom: 24px;
  font-size: 0.95rem;
}

textarea {
  width: 100%;
  height: 240px;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 0.95rem;
  color: var(--text);
  background: rgba(15, 23, 42, 0.4);
  resize: vertical;
  outline: none;
  transition: all 0.3s ease;
}

textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
}

textarea::placeholder { color: #475569; }

.row {
  margin-top: 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

button.gen {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 24px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
}

button.gen:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
  filter: brightness(1.1);
}

button.gen:active { transform: translateY(0); }

button.gen:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.result {
  margin-top: 20px;
  padding: 18px;
  border-radius: 12px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px dashed rgba(16, 185, 129, 0.4);
  display: none;
  animation: slideIn 0.5s ease both;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result.show { display: block; }

.result-label {
  display: block;
  font-size: 0.85rem;
  color: var(--success);
  margin-bottom: 10px;
  font-weight: 700;
}

.result-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 12px;
  word-break: break-all;
}

.result-link:hover { text-decoration: underline; }

button.copy {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  color: var(--muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}

button.copy:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text);
  border-color: rgba(255,255,255,0.2);
}

button.copy.copied {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}

.msg {
  margin-top: 14px;
  font-size: 0.85rem;
  min-height: 1.2em;
}

.error { color: #f87171; }
.ok { color: var(--success); }

/* Paste History */
.history {
  margin-top: 32px;
  animation: fadeInUp 1s both;
}

.history h3 {
  font-size: 1rem;
  color: var(--muted);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.paste-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  animation: fadeInUp 0.6s both;
}

.paste-item .id {
  font-family: monospace;
  font-size: 0.85rem;
  color: var(--primary);
  font-weight: 700;
}

.paste-item .time {
  font-size: 0.8rem;
  color: var(--muted);
}

.paste-item a {
  color: var(--text);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
}

.paste-item a:hover { color: var(--primary); }

footer {
  margin-top: 30px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  animation: fadeInUp 1.1s both;
}

footer b { color: var(--muted); }

@media (max-width: 480px) {
  .row { flex-direction: column; align-items: stretch; }
  button.gen { width: 100%; }
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
  <header class="animate-in">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 20v-6a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v6"></path>
        <path d="M14 2v6a4 4 0 0 1 4 4h3a4 4 0 0 0 4-4V2"></path>
      </svg>
      HTML Paste
    </div>
    <div class="tagline">Niche apna HTML paste karo, "Generate URL" dabao — ek share karne layak URL mil jayega.</div>
  </header>

  <div class="card animate-in">
    <h1>HTML Paste</h1>
    <p class="sub">Sirf HTML daalo, URL banao, kisi ko bhejo.</p>

    <textarea id="html" placeholder="&lt;h1&gt;Namaste Duniya!&lt;/h1&gt;
&lt;p style=&quot;color: #6366f1&quot;&gt;Yeh mera custom HTML page hai.&lt;/p&gt;
&lt;button style=&quot;padding: 8px 16px&quot;&gt;Click Me&lt;/button&gt;"></textarea>

    <div class="row">
      <button class="gen" id="btn" onclick="createPaste()">Generate URL</button>
    </div>

    <div class="result" id="result">
      <span class="result-label">🔗 Apna Shareable URL:</span>
      <a id="url" href="#" target="_blank" class="result-link"></a>
      <button class="copy" id="copyBtn" onclick="copyUrl()">Copy</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="history animate-in">
    <h3>📜 Recent Pastes</h3>
    <div id="historyList">Abhi koi paste nahi hai.</div>
  </div>

  <footer class="animate-in">
    No Docker &bull; Runs on Node.js &bull; Deploy on Railway (free tier) or any VPS
  </footer>
</div>

<script>
// Load recent pastes from localStorage (client-side history)
function loadHistory() {
  try {
    const raw = localStorage.getItem('hp_history') || '[]';
    const arr = JSON.parse(raw);
    const list = document.getElementById('historyList');
    if (arr.length === 0) {
      list.innerHTML = 'Abhi koi paste nahi hai.';
      return;
    }
    list.innerHTML = arr.slice(-5).reverse().map(p => `
      <div class="paste-item">
        <div>
          <div class="id">${p.id}</div>
          <div class="time">${new Date(p.time).toLocaleString('hi-IN')}</div>
        </div>
        <a href="${p.url}" target="_blank">Open URL ↗</a>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
  }
}

function saveHistory(id, url) {
  try {
    const raw = localStorage.getItem('hp_history') || '[]';
    const arr = JSON.parse(raw);
    arr.unshift({ id, url, time: Date.now() });
    localStorage.setItem('hp_history', JSON.stringify(arr.slice(0, 20)));
    loadHistory();
  } catch (e) {
    console.error(e);
  }
}

async function createPaste() {
  const html = document.getElementById('html').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const result = document.getElementById('result');

  if (!html) {
    msg.textContent = 'Pehle HTML paste karo!';
    msg.className = 'msg error';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Processing...';
  msg.textContent = '';

  try {
    const resp = await fetch('/api/paste', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html }),
    });
    const data = await resp.json();

    if (!resp.ok) throw new Error(data.error || 'Kuch galat hua');

    const link = document.getElementById('url');
    link.href = data.url;
    link.textContent = data.url;
    result.classList.add('show');
    msg.textContent = 'URL ready hai! Neeche copy karo.';
    msg.className = 'msg ok';

    saveHistory(data.id, data.url);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate URL';
  }
}

function copyUrl() {
  const url = document.getElementById('url').href;
  navigator.clipboard.writeText(url).then(() => {
    const b = document.getElementById('copyBtn');
    b.classList.add('copied');
    b.textContent = 'Copied!';
    setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('copied'); }, 1200);
  });
}

// Init
loadHistory();
</script>
</body>
</html>
